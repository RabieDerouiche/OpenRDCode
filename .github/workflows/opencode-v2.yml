# Checks of the OpenCode v2 pack (opencode-v2/) on every push that changes it, and on demand (Actions tab, "Run
# workflow"). Three jobs: every suite of the pack (no .NET SDK, no registry needed); the stories of the pack with the
# real .NET SDKs 10 and 8 (real builds, real xUnit and MSTest tests, real coverage, the real messages of the host, of
# the test host and of package validation): the flow of /fortify and of its test-guardian, the developer's days, the
# environment problems; and the front-end with the real tools (Jest, Vitest, Angular with Vitest and with Karma in
# ChromeHeadless, from the npm registry). A failed check becomes an annotation of the run; the logs are kept as an
# artifact of the run.
name: opencode-v2

on:
  push:
    paths:
      - "opencode-v2/**"
      - ".github/workflows/opencode-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: Suites du pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Dépendances des simulateurs
        run: |
          command -v shellcheck > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck > /dev/null; }
          cd tools && npm install --no-save --silent web-tree-sitter@0.25.10 tree-sitter-bash@0.25.0 gray-matter@4.0.3
      - name: Toutes les suites
        run: |
          # the logs outside the pack: validate.js checks that every file of the pack is described
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          failed=0
          # annotate <title> <log>: each FAIL block of a suite as an error annotation of the run
          annotate() {
            awk -v t="$1" '
              function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
              { gsub(/%/, "%25"); gsub(/\r/, "") }
              /^FAIL/ { flush(); msg = $0; next }
              /^    / && msg != "" && n < 30 { msg = msg "%0A" $0; n++; next }
              { flush() }
              END { flush() }' "$2"
          }
          # the last line of each suite, all in one notice at the end (a step keeps 10 notices at most)
          results="$logs/results.txt"
          : > "$results"
          suite() {
            title=$1 log="$logs/$2.log"
            shift 2
            if "$@" > "$log" 2>&1; then
              echo "✅ $title : $(tail -n 1 "$log")" >> "$results"
            else
              failed=1
              annotate "$title" "$log"
              echo "::error title=$title::$(tail -n 1 "$log")"
              echo "❌ $title : $(tail -n 1 "$log")" >> "$results"
            fi
          }
          suite "shellcheck" shellcheck sh -c 'shellcheck -S warning scripts/*.sh tools/*.sh && echo "shellcheck: OK"'
          suite "validate.js" validate node tools/validate.js
          suite "plugin-test" plugin node tools/plugin-test.mjs
          suite "permission-sim" permissions sh -c 'cd tools && node permission-sim.mjs ..'
          for s in dash bash; do
            suite "scripts-test $s" "scripts-$s" sh tools/scripts-test.sh "$s"
            suite "dotnet-test $s" "dotnet-$s" sh tools/dotnet-test.sh "$s"
            suite "scenarios-test $s" "scenarios-$s" sh tools/scenarios-test.sh "$s"
            suite "fortify-test $s" "fortify-$s" sh tools/fortify-test.sh "$s"
            suite "frontend-test $s" "frontend-$s" sh tools/frontend-test.sh "$s"
          done
          echo "::notice title=Suites du pack::$(awk '{ gsub(/%/, "%25"); printf "%s%s", (NR > 1 ? "%0A" : ""), $0 }' "$results")"
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-suites
          path: ${{ runner.temp }}/logs/

  real-dotnet:
    name: Histoires avec le vrai dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: fortify-test --real, scenarios-test --real et real-dotnet-test
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          dotnet --info > "$logs/dotnet-info.log" 2>&1
          failed=0
          for t in fortify scenarios real-dotnet; do
            log="$logs/$t-real.log"
            case "$t" in
              real-dotnet) sh tools/real-dotnet-test.sh dash > "$log" 2>&1 || failed=1 ;;
              *) sh "tools/$t-test.sh" --real dash > "$log" 2>&1 || failed=1 ;;
            esac
            awk -v t="$t-test --real" '
              function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
              { gsub(/%/, "%25"); gsub(/\r/, "") }
              # the values the checks leave open (counts of lines that coverlet decides): one notice
              /^NOTE: / { notes = notes (notes == "" ? "" : "%0A") substr($0, 7); flush(); next }
              /^FAIL/ { flush(); msg = $0; next }
              /^    / && msg != "" && n < 30 { msg = msg "%0A" $0; n++; next }
              { flush() }
              END { flush(); if (notes != "") print "::notice title=" t " (valeurs réelles)::" notes }' "$log"
            echo "::notice title=$t-test --real::$(tail -n 1 "$log")"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-real-dotnet
          path: ${{ runner.temp }}/logs/

  real-frontend:
    name: Front-end avec les vrais outils
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: frontend-test --real
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          { node --version; npm --version; command -v google-chrome chromium chromium-browser; } > "$logs/tools.log" 2>&1
          log="$logs/frontend-real.log"
          failed=0
          sh tools/frontend-test.sh --real dash > "$log" 2>&1 || failed=1
          awk -v t="frontend-test --real" '
            function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
            { gsub(/%/, "%25"); gsub(/\r/, "") }
            /^FAIL/ { flush(); msg = $0; next }
            /^    / && msg != "" && n < 40 { msg = msg "%0A" $0; n++; next }
            { flush() }
            END { flush() }' "$log"
          echo "::notice title=frontend-test --real::$(tail -n 1 "$log")"
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-real-frontend
          path: ${{ runner.temp }}/logs/
