# Checks of the OpenCode v2 pack (opencode-v2/) on every push that changes it, and on demand (Actions tab, "Run
# workflow"). Six jobs: every suite of the pack (no .NET SDK, no registry needed); the stories of the pack with the
# real .NET SDKs 10 and 8 (real builds, real xUnit and MSTest tests, real coverage, the real messages of the host, of
# the test host and of package validation): the flow of /fortify and of its test-guardian, the developer's days, the
# environment problems; the replacement of Blazorise by native Razor under its safety net (Blazorise, bUnit, coverlet
# and the native components of blazor-native.sh for real, .NET 10 and 8); the replacement of AutoMapper by Mapperly
# under snapshot tests recorded on AutoMapper (AutoMapper 14, Mapperly, Entity Framework Core with SQLite, .NET 10 and
# 8); the environments for real (Keycloak, a squid proxy with credentials, an internal certificate authority, SQL
# Server, HashiCorp Vault and an ASP.NET Core API deployed behind the proxy, in Docker: /tests api, /tests env and
# /outil http with the real SDKs); and the front-end with the real tools (Jest, Vitest, Angular with Vitest and with
# Karma in ChromeHeadless, from the npm registry). The suites also check that the diagrams of the flow map and of the deck of
# the flows are drawn from their sources, and that each commit of the pack has its entry in RELEASE-NOTES.md. A failed check becomes an
# annotation of the run; the logs are kept as an artifact of the run.
name: opencode-v2

on:
  push:
    paths:
      - "opencode-v2/**"
      - ".github/workflows/opencode-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: Suites du pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
        with:
          # the commits of the push: each one of the pack has its entry in RELEASE-NOTES.md
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Dépendances des simulateurs
        run: |
          command -v shellcheck > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck > /dev/null; }
          cd tools && npm install --no-save --silent web-tree-sitter@0.25.10 tree-sitter-bash@0.25.0 gray-matter@4.0.3
      - name: Toutes les suites
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # the logs outside the pack: validate.js checks that every file of the pack is described
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          failed=0
          # annotate <title> <log>: each FAIL block of a suite as an error annotation of the run, and each finding of
          # shellcheck (its gcc format: file:line:column: level: message) on its file and line
          annotate() {
            awk -v t="$1" '
              function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
              { gsub(/%/, "%25"); gsub(/\r/, "") }
              /^[^: ]+:[0-9]+:[0-9]+: (error|warning|note|style): / {
                flush(); split($0, f, ":"); m = $0; sub(/^[^:]+:[0-9]+:[0-9]+: /, "", m)
                print "::error file=opencode-v2/" f[1] ",line=" f[2] ",col=" f[3] ",title=" t "::" m; next
              }
              /^FAIL/ { flush(); msg = $0; next }
              /^    / && msg != "" && n < 30 { msg = msg "%0A" $0; n++; next }
              { flush() }
              END { flush() }' "$2"
          }
          # the last line of each suite, all in one notice at the end (a step keeps 10 notices at most)
          results="$logs/results.txt"
          : > "$results"
          suite() {
            title=$1 log="$logs/$2.log"
            shift 2
            if "$@" > "$log" 2>&1; then
              echo "✅ $title : $(tail -n 1 "$log")" >> "$results"
            else
              failed=1
              annotate "$title" "$log"
              echo "::error title=$title::$(tail -n 1 "$log")"
              echo "❌ $title : $(tail -n 1 "$log")" >> "$results"
            fi
          }
          suite "shellcheck" shellcheck sh -c 'shellcheck -S warning -f gcc scripts/*.sh tools/*.sh && echo "shellcheck: OK"'
          suite "validate.js" validate node tools/validate.js
          suite "carte des flux" carte node tools/carte-render.mjs --check
          suite "notes de version" notes sh tools/release-notes.sh check
          # the commits of this push (a new branch: those that main does not have; otherwise the last one)
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            range="$BEFORE..HEAD"
          elif git rev-parse -q --verify origin/main > /dev/null && ! git merge-base --is-ancestor HEAD origin/main; then
            range="origin/main..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          suite "une note par commit" notes-commits sh tools/release-notes.sh commits "$range"
          suite "plugin-test" plugin node tools/plugin-test.mjs
          suite "permission-sim" permissions sh -c 'cd tools && node permission-sim.mjs ..'
          for s in dash bash; do
            suite "scripts-test $s" "scripts-$s" sh tools/scripts-test.sh "$s"
            suite "dotnet-test $s" "dotnet-$s" sh tools/dotnet-test.sh "$s"
            suite "scenarios-test $s" "scenarios-$s" sh tools/scenarios-test.sh "$s"
            suite "fortify-test $s" "fortify-$s" sh tools/fortify-test.sh "$s"
            suite "frontend-test $s" "frontend-$s" sh tools/frontend-test.sh "$s"
            suite "environments-test $s" "environments-$s" sh tools/environments-test.sh "$s"
          done
          echo "::notice title=Suites du pack::$(awk '{ gsub(/%/, "%25"); printf "%s%s", (NR > 1 ? "%0A" : ""), $0 }' "$results")"
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-suites
          path: ${{ runner.temp }}/logs/

  real-dotnet:
    name: Histoires avec le vrai dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: fortify-test --real, scenarios-test --real et real-dotnet-test
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          dotnet --info > "$logs/dotnet-info.log" 2>&1
          failed=0
          for t in fortify scenarios real-dotnet; do
            log="$logs/$t-real.log"
            case "$t" in
              real-dotnet) sh tools/real-dotnet-test.sh dash > "$log" 2>&1 || failed=1 ;;
              *) sh "tools/$t-test.sh" --real dash > "$log" 2>&1 || failed=1 ;;
            esac
            awk -v t="$t-test --real" '
              function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
              { gsub(/%/, "%25"); gsub(/\r/, "") }
              # the values the checks leave open (counts of lines that coverlet decides): one notice
              /^NOTE: / { notes = notes (notes == "" ? "" : "%0A") substr($0, 7); flush(); next }
              /^FAIL/ { flush(); msg = $0; next }
              /^    / && msg != "" && n < 30 { msg = msg "%0A" $0; n++; next }
              { flush() }
              END { flush(); if (notes != "") print "::notice title=" t " (valeurs réelles)::" notes }' "$log"
            echo "::notice title=$t-test --real::$(tail -n 1 "$log")"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-real-dotnet
          path: ${{ runner.temp }}/logs/

  real-blazor:
    name: Blazorise vers le natif (vrai .NET, bUnit, composants natifs)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: blazor-native-test
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          dotnet --list-sdks > "$logs/sdks.log" 2>&1
          log="$logs/blazor-native.log"
          failed=0
          sh tools/blazor-native-test.sh dash > "$log" 2>&1 || failed=1
          awk -v t="blazor-native-test" '
            function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
            { gsub(/%/, "%25"); gsub(/\r/, "") }
            /^NOTE: / { notes = notes (notes == "" ? "" : "%0A") substr($0, 7); flush(); next }
            /^FAIL/ { flush(); msg = $0; next }
            /^    / && msg != "" && n < 90 { msg = msg "%0A" $0; n++; next }
            { flush() }
            END { flush(); if (notes != "") print "::notice title=" t " (valeurs réelles)::" notes }' "$log"
          echo "::notice title=blazor-native-test::$(tail -n 1 "$log")"
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-real-blazor
          path: ${{ runner.temp }}/logs/

  real-automapper:
    name: AutoMapper vers Mapperly et Mapster (vrai .NET, AutoMapper 14, Mapperly, Mapster, EF Core SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: automapper-test
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          dotnet --list-sdks > "$logs/sdks.log" 2>&1
          log="$logs/automapper.log"
          failed=0
          AUTOMAPPER_TEST_SHOW="$logs/show.txt" sh tools/automapper-test.sh dash > "$log" 2>&1 || failed=1
          # what AutoMapper wrote in the golden files, the code Mapperly generated and the switch to Mapster, in the log
          echo "::group::Fichiers de référence d'AutoMapper, code généré par Mapperly, bascule vers Mapster"
          cat "$logs/show.txt" 2> /dev/null
          echo "::endgroup::"
          awk -v t="automapper-test" '
            function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
            { gsub(/%/, "%25"); gsub(/\r/, "") }
            /^NOTE: / { notes = notes (notes == "" ? "" : "%0A") substr($0, 7); flush(); next }
            /^FAIL/ { flush(); msg = $0; next }
            /^    / && msg != "" && n < 60 { msg = msg "%0A" $0; n++; next }
            { flush() }
            END { flush(); if (notes != "") print "::notice title=" t " (valeurs réelles)::" notes }' "$log"
          echo "::notice title=automapper-test::$(tail -n 1 "$log")"
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-real-automapper
          path: ${{ runner.temp }}/logs/

  real-oidc:
    name: Environnements réels (Keycloak, squid, Vault, .NET 10 et 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: oidc-real-test
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs/lab"
          { dotnet --list-sdks; docker version; } > "$logs/tools.log" 2>&1
          log="$logs/oidc-real.log"
          failed=0
          OIDC_LAB_LOGS="$logs/lab" sh tools/oidc-real-test.sh dash > "$log" 2>&1 || failed=1
          awk -v t="oidc-real-test" '
            function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
            { gsub(/%/, "%25"); gsub(/\r/, "") }
            /^NOTE: / { notes = notes (notes == "" ? "" : "%0A") substr($0, 7); flush(); next }
            /^FAIL/ { flush(); msg = $0; next }
            /^    / && msg != "" && n < 40 { msg = msg "%0A" $0; n++; next }
            { flush() }
            END { flush(); if (notes != "") print "::notice title=" t " (laboratoire)::" notes }' "$log"
          echo "::notice title=oidc-real-test::$(tail -n 1 "$log")"
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-real-oidc
          path: ${{ runner.temp }}/logs/

  real-frontend:
    name: Front-end avec les vrais outils
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: opencode-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: frontend-test --real
        run: |
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          { node --version; npm --version; command -v google-chrome chromium chromium-browser; } > "$logs/tools.log" 2>&1
          log="$logs/frontend-real.log"
          failed=0
          sh tools/frontend-test.sh --real dash > "$log" 2>&1 || failed=1
          awk -v t="frontend-test --real" '
            function flush() { if (msg != "") { print "::error title=" t "::" msg; msg = ""; n = 0 } }
            { gsub(/%/, "%25"); gsub(/\r/, "") }
            /^FAIL/ { flush(); msg = $0; next }
            /^    / && msg != "" && n < 40 { msg = msg "%0A" $0; n++; next }
            /^(NOTE: |node v|Angular [0-9]+: )/ { flush(); print "::notice title=" t "::" $0; next }
            { flush() }
            END { flush() }' "$log"
          echo "::notice title=frontend-test --real::$(tail -n 1 "$log")"
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-real-frontend
          path: ${{ runner.temp }}/logs/
